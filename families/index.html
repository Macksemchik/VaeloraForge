<!DOCTYPE html>
<html lang="uk">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Роди | Vaelora Forge</title>
        <link rel="stylesheet" href="../styles.css">
        <link rel="icon" type="image/png" href="../images/favicon.png">

        <style>
            
            body{
                font-family:Arial,sans-serif;
                background:#f5f7fb;
                color:#1f2937;
                margin:0;
            }

            .page{
                max-width:1400px;
                margin:auto;
                padding:20px;
            }

            .article-card{
                background:white;
                border-radius:20px;
                padding:40px;
                box-shadow:0 4px 20px rgba(0,0,0,0.08);
            }

            h1{
                color:#1e3a8a;
                margin-bottom:10px;
            }

            .page-description{
                color:#6b7280;
                margin-bottom:30px;
            }
            
            .search-box{
                width:100%;
                padding:15px;
                font-size:1rem;
                border:2px solid #c7d2fe;
                border-radius:14px;
                margin-bottom:30px;
            }

.characters{
    display:flex;
    flex-direction:column;
    gap:15px;
}

.character-card{
    display:flex;
    justify-content:space-between;
    align-items:stretch;
    background:#eef2ff;
    border:1px solid #c7d2fe;
    border-radius:16px;
    text-decoration:none;
    color:inherit;
    transition:0.2s;
    overflow:hidden; /* Обрізає зображення по закруглених кутах */
    padding-left:20px;
}

.character-card:hover{
    transform:translateY(-2px);
    box-shadow:0 4px 15px rgba(79,70,229,0.15);
}

.character-info{
    flex:1;
    padding:20px 20px 20px 0;
}

.character-image{
    width:220px;
    height:100%;
    object-fit:cover;
    display:block;
    margin:0;
    flex-shrink:0;
}

.character-name{
    font-size:1.4rem;
    font-weight:bold;
    color:#1e3a8a;
    margin-bottom:8px;
}

.character-description{
    color:#4b5563;
}

            @media(max-width:700px){

                .character-card{
                    flex-direction:column;
                    padding-left:0;
                }
                .character-info{
                    padding:20px;
                    text-align:center;
                }
                .character-image{
                    width:100%;
                    height:220px;
                }
            }
        </style>
    </head>

    <body>
        <a href="../index.html" class="logo-link">
            <img src="../images/logo.png" class="logo">
            <div class="logo-text">
                <div class="logo-top">Vaelora</div>
                <div class="logo-bottom">Forge</div>
            </div>
        </a>

<div class="page">

<div class="article-card">

<h1>Роди</h1>

<p class="page-description">Історія найвеличніших династій, родів і благородних домів мультивсесвіту.</p>

<input
type="text"
id="searchInput"
class="search-box"
placeholder="Пошук роду...">

                <div class="characters" id="charactersList">
                    <a href="../families/aurelions.html" class="character-card">
                        <div class="character-info">
                            <div class="character-name">Ауреліони</div>
                            <div class="character-description">Найвпливовіший рід в історії мультивсесвіту, довгий час контролював велику частину космічного простору, але підтримував баланс.</div>
                        </div>
                        <img src="../images/families/aurelions.jpg" class="character-image" alt="Ауреліони">
                    </a>
                </div>
            </div>
        </div>
        <script>

const searchInput =
document.getElementById("searchInput");

searchInput.addEventListener(
"keyup",
function(){

let filter =
this.value.toLowerCase();

let cards =
document.querySelectorAll(
".character-card"
);

cards.forEach(card=>{

let text =
card.textContent.toLowerCase();

if(text.includes(filter)){
card.style.display="flex";
}
else{
card.style.display="none";
}

});

});

        </script>
    </body>
</html>
